<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color-Changer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="color-container">
      <div class="box">
        <input type="range" id="red" min="0" max="255" value="127" />
        <input type="range" id="green" min="0" max="255" value="127" />
        <input type="range" id="blue" min="0" max="255" value="127" />
        <div id="rgb">rgb(0,0,0)</div>
      </div>
    </div>

    <script src="app2.js"></script>
  </body>
</html>
