<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f3f4f6;
      }

      .counter-container {
        background: white;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
      }

      h2 {
        margin-bottom: 16px;
        color: #1f2937;
      }

      textarea {
        width: 100%;
        height: 150px;
        padding: 12px;
        border: 2px solid #e5e7eb;
        border-radius: 6px;
        resize: none;
        font-size: 16px;
        outline: none;
      }

      textarea:focus {
        border-color: #3b82f6;
      }

      .counter-stats {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
        font-size: 14px;
        color: #6b7280;
        font-weight: bold;
      }

      .counter-stats.warning {
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="counter-container">
      <h2>Live Character Counter</h2>
      <textarea
        id="text-input"
        placeholder="Type your message here..."
        maxlength="280"
      ></textarea>
      <div class="counter-stats">
        <span id="char-count">0</span> / <span id="max-limit">280</span>
      </div>
    </div>
    <script>
      const textInput = document.getElementById("text-input");
      const charCount = document.getElementById("char-count");
      const statsContainer = document.querySelector(".counter-stats");
      const maxLength = textInput.maxLength;

      textInput.addEventListener("input", () => {
        const currentLength = textInput.value.length;
        charCount.textContent = currentLength;

        if (currentLength >= maxLength - 20) {
          statsContainer.classList.add("warning");
        } else {
          statsContainer.classList.remove("warning");
        }
      });
    </script>
  </body>
</html>
