<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Notes App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100 p-6 min-h-screen">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
      <h1 class="text-2xl font-bold mb-4 text-gray-800 text-center">
        My Notes
      </h1>

      <form id="note-form" class="mb-6 space-y-3">
        <input type="hidden" id="note-id" />
        <input
          type="text"
          id="note-title"
          placeholder="Note Title"
          required
          class="w-full p-2 border rounded-md focus:outline-blue-500"
        />
        <textarea
          id="note-content"
          placeholder="Take a note..."
          required
          rows="3"
          class="w-full p-2 border rounded-md focus:outline-blue-500"
        ></textarea>

        <div class="flex gap-2">
          <button
            type="submit"
            id="save-btn"
            class="w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 font-medium cursor-pointer"
          >
            Save Note
          </button>
          <button
            type="button"
            id="cancel-btn"
            class="hidden w-1/3 bg-gray-300 text-gray-700 p-2 rounded-md hover:bg-gray-400 cursor-pointer"
          >
            Cancel
          </button>
        </div>
      </form>

      <div id="notes-list" class="space-y-3"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
