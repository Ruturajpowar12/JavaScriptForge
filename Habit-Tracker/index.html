
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>

<link rel="stylesheet" href="style.css">
<script src="https://kit.fontawesome.com/0945485641.js" crossorigin="anonymous"></script>
</head>

<body>

<header>
    <div class="logo-section">
        <img src="https://d33wubrfki0l68.cloudfront.net/9836afbed2a841ad50b569f3d6fc7ae065ceb175/e34cd/assets/appicon.png" alt="Logo">
    </div>

    <div class="mid">
        <h1>Habit Tracker</h1>
        <p id="current-date"></p>
    </div>

    <div class="header-right">
        <button id="theme-btn">
            <i class="fa-solid fa-circle-half-stroke"></i> Mode
        </button>
    </div>
</header>

<main>

    <section class="add-habit">
        <input type="text" id="habit-input" placeholder="Enter habit name">
        <button id="add-btn">Add Habit</button>
    </section>

    <section class="filter-section">
        <button id="all-btn">All</button>
        <button id="completed-btn">Completed</button>
        <button id="pending-btn">Pending</button>
    </section>

    <section class="habit-list"></section>

    <section class="statistics">

        <div class="stat-card">
            <h2 id="total-habits">0</h2>
            <p>Total Habits</p>
        </div>

        <div class="stat-card">
            <h2 id="completed-habits">0</h2>
            <p>Completed</p>
        </div>

        <div class="stat-card">
            <h2 id="pending-habits">0</h2>
            <p>Pending</p>
        </div>

        <div class="stat-card">
            <h2 id="completion-rate">0%</h2>
            <p>Completion</p>
        </div>

    </section>

</main>

<footer>
    <p>Habit Tracker © 2026</p>
    <p>Made with HTML, CSS & JavaScript</p>
</footer>

<script src="app.js"></script>

</body>
</html>
