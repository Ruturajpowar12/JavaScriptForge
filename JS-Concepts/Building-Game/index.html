<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildinfg a Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h1>Rock Paper Scissors</h1>
    </nav>

    <main>
        <div class="pic">
            <img src="./assets/rock2.png" alt="rock" id="rock">
            <img src="./assets/paper2.png" alt="papar" id="papar">
            <img src="./assets/scissor.jpg" alt="scissors" id="scissors">

        </div>
        <div class="score">
            <div class="your-score">
                <p id="you">0</p>
                <h4>You</h4>
            </div>
            <div class="com-score">
                <p id="com">0</p>
                <h4>Com</h4>
            </div>
        </div>
        <div class="msg">
            <p>Play Your Move</p>
        </div>
    </main>

    <script src="game.js">
    </script>
</body>

</html>
