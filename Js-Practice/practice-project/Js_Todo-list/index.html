<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js-ToDo-List </title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/0945485641.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class="box">
        <nav>
            <div class="logo">
                <img src="https://www.w3schools.com/js/img_javascript_480.jpg" alt="logo">
                <h1>JS To-Do List</h1>
            </div>

            <div class="theme">
                <button>theme</button>
            </div>

        </nav>
        <div class="main">
            <div class="input-box">
                <input type="text"  id="inputTask">
                <button id="addtask">+ Add</button>
            </div>
            <div class="tracker">
                <div><button id="all">All</button>
<button id="active">Active</button>
<button id="completed">Completed</button></div>

                <p> 3 task left</p>
            </div>
            <div class="tasklist">
                <ul>
                    
                </ul>

            </div>
        </div>
        <div class="footer">
            Made with JavaScript <i class="fa-solid fa-heart"></i>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
