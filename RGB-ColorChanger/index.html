<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorChanger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <input type="range" name="red" id="red" min="0" max="255" value="128">
        <input type="range" name="green" id="green" min="0" max="255" value="128">
        <input type="range" name="blue" id="blue" min="0" max="255" value="128">
        <div>
            <p id="rgb-text">rgb(128,128,128)</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
