<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Image genrator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="container">
        <header class="header">
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fa-soild fa-wand-magic-sparkles"></i>
                </div>
                <h1>AI Image Generator</h1>
            </div>
            <button class="theme-toggle">
                <i class="fa-soild fa-moon"></i>
            </button>

            <div class="main-content">
                <form class="form-prompt ">
                    <div class="prompt-container">
                        <textarea class="prompt-input" placeholder="Decsribe your imshinsation in desstil.. " required
                            autufocus></textarea>
                        <button class="prompt-btn">
                            <i class="fa-soid fa dice"></i>
                        </button>
                    </div>

                    <div class="prompt-actions">
                        <div class="select-wrapper">
                            <select class="custom-select">
                                <option value="">Select Modal</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </header>
    </div>

</body>

</html>
